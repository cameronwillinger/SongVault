<script>
/* ============ SongVault Sync core (IDENTICAL in SongVault.html and SongVault Mobile) ============
   Sync file = <name>.songvault.zip :  library.json  +  media.json  +  media/<id>.<ext>  +  SYNC-README.txt
   Merge = per-entity, per-field 3-way merge (newest updatedAt wins, conflicts keep a copy), tombstones for deletes. */
const SVS=(()=>{
const FORMAT=1;
const ENT=['songs','artists','albums','collaborators'];
const TYPE_LABEL={songs:'song',artists:'pen name',albums:'album',collaborators:'collaborator'};
const EPOCH='2000-01-01T00:00:00.000Z';
const nowIso=()=>new Date().toISOString();
const uidx=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const normS=s=>String(s||'').toLowerCase().replace(/[^a-z0-9$]+/g,' ').trim();
const isEmpty=v=>v==null||v===''||v===false||v===0||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
const canon=v=>isEmpty(v)?'':JSON.stringify(v);
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36)}
const fh=v=>{const c=canon(v);return c===''?'':fnv(c)};
const IGNORE=new Set(['id','updated','updatedAt','created','example','artworkData','artworkThumb','cover','coverThumb','versions','grokNotes','media','mediaGone','songvault','songvaultVersion','artworkFile','artistName','albumTitle']);
const FLAT=['checklist','links','video','tools'];
function flat(e){const o={};for(const k in e){if(IGNORE.has(k))continue;const v=e[k];if(FLAT.includes(k)&&v&&typeof v==='object'&&!Array.isArray(v)){for(const j in v)o[k+'.'+j]=v[j]}else o[k]=v}return o}
function setField(e,f,v){const i=f.indexOf('.');if(i>0&&FLAT.includes(f.slice(0,i))){const g=f.slice(0,i);if(!e[g]||typeof e[g]!=='object')e[g]={};e[g][f.slice(i+1)]=v}else e[f]=v}
const upd=e=>e.updatedAt||e.updated||e.created||'';
const dayStr=()=>nowIso().slice(0,10);

/* ---------- media hashing ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crcUpdate(c,b){for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return c}
async function crc32Blob(blob){let c=0xFFFFFFFF;const CH=4*1024*1024;for(let o=0;o<blob.size;o+=CH){c=crcUpdate(c,new Uint8Array(await blob.slice(o,o+CH).arrayBuffer()))}return(c^0xFFFFFFFF)>>>0}
const hex=buf=>[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashBlob(blob){
 const BIG=48*1024*1024;
 try{ if(!(self.crypto&&crypto.subtle))throw 0;
  if(blob.size<=BIG)return 'h'+hex(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer())).slice(0,32);
  const CH=4*1024*1024,mid=Math.floor(blob.size/2);const parts=[new TextEncoder().encode('size'+blob.size),await blob.slice(0,CH).arrayBuffer(),await blob.slice(mid,mid+CH).arrayBuffer(),await blob.slice(blob.size-CH).arrayBuffer()];
  return 's'+hex(await crypto.subtle.digest('SHA-256',await new Blob(parts).arrayBuffer())).slice(0,32);
 }catch(e){return 'c'+(await crc32Blob(blob)).toString(16).padStart(8,'0')+blob.size.toString(16)}
}
const EXT={'audio/mp4':'m4a','audio/x-m4a':'m4a','audio/mpeg':'mp3','audio/wav':'wav','audio/x-wav':'wav','audio/webm':'webm','audio/aac':'aac','audio/ogg':'ogg','audio/flac':'flac','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm','video/x-m4v':'m4v','image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/heic':'heic','image/gif':'gif'};
const extOf=(mime,name)=>{const m=/\.([A-Za-z0-9]{1,5})$/.exec(name||'');return m?m[1].toLowerCase():(EXT[mime]||'bin')};

/* ---------- ZIP (store) writer with Blob parts + reader (store/deflate) ---------- */
const enc=s=>new TextEncoder().encode(s);
async function makeZipBlob(files,onProgress){
 const parts=[],cd=[];let off=0;const d=new Date();
 const dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate()),tm=(d.getHours()<<11|d.getMinutes()<<5|(d.getSeconds()>>1));
 let i=0;
 for(const f of files){
  const isDir=f.path.endsWith('/');const name=enc(f.path);
  let data=isDir?new Uint8Array(0):(typeof f.data==='string'?enc(f.data):f.data);
  const size=data instanceof Blob?data.size:data.length;
  if(size>=0xFFFFFFFF||off>=0xFFFFFFF0)throw new Error('Sync file would be over 4 GB — turn off “include media” and move big videos with AirDrop / Files instead.');
  const crc=data instanceof Blob?await crc32Blob(data):(crcUpdate(0xFFFFFFFF,data)^0xFFFFFFFF)>>>0;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,name,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);c.setUint32(38,isDir?0x10:0,true);c.setUint32(42,off,true);
  cd.push(c.buffer,name);off+=30+name.length+size;
  if(onProgress)onProgress(++i,files.length);
 }
 let cdl=0;cd.forEach(x=>cdl+=x.byteLength!==undefined?x.byteLength:x.length);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,e.buffer],{type:'application/zip'});
}
async function inflateRaw(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function readZip(blob){
 const tailN=Math.min(blob.size,66000);const tail=new DataView(await blob.slice(blob.size-tailN).arrayBuffer());let p=-1;
 for(let i=tailN-22;i>=0;i--){if(tail.getUint32(i,true)===0x06054b50){p=i;break}}
 if(p<0)throw new Error('Not a ZIP file');
 const n=tail.getUint16(p+10,true),cdSize=tail.getUint32(p+12,true),cdOff=tail.getUint32(p+16,true);
 const cdv=new DataView(await blob.slice(cdOff,cdOff+cdSize).arrayBuffer());const dec=new TextDecoder();const map=new Map();let o=0;
 for(let i=0;i<n;i++){
  if(cdv.getUint32(o,true)!==0x02014b50)break;
  const method=cdv.getUint16(o+10,true),csize=cdv.getUint32(o+20,true),size=cdv.getUint32(o+24,true),nl=cdv.getUint16(o+28,true),el=cdv.getUint16(o+30,true),cl=cdv.getUint16(o+32,true),lo=cdv.getUint32(o+42,true);
  const name=dec.decode(new Uint8Array(cdv.buffer,o+46,nl));o+=46+nl+el+cl;
  if(name.endsWith('/'))continue;
  map.set(name,{name,size,csize,method,async blob(){const lh=new DataView(await blob.slice(lo,lo+30).arrayBuffer());const st=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    const raw=blob.slice(st,st+csize);if(method===0)return raw;if(method===8)return new Blob([await inflateRaw(new Uint8Array(await raw.arrayBuffer()))]);throw new Error('Unsupported ZIP compression')},
   async text(){return await (await this.blob()).text()}});
 }
 return map;
}

/* ---------- library helpers ---------- */
function migrate(lib,opts){opts=opts||{};
 lib.artists=lib.artists||[];lib.albums=lib.albums||[];lib.collaborators=lib.collaborators||[];lib.songs=lib.songs||[];
 lib.tombstones=Array.isArray(lib.tombstones)?lib.tombstones:[];lib.settings=lib.settings||{};
 const fb=(lib.settings&&lib.settings.created)||EPOCH;
 for(const t of ENT)for(const e of lib[t]){if(!e.id)e.id=uidx();if(!e.updatedAt)e.updatedAt=e.updated||e.created||fb;if(t==='songs'){if(!e.updated)e.updated=e.updatedAt;if(!Array.isArray(e.media))e.media=[];if(!Array.isArray(e.mediaGone))e.mediaGone=[]}}
 if(!opts.remote&&!lib.settings.deviceId)lib.settings.deviceId='dev_'+uidx();
 return lib}
function entHash(e){return JSON.stringify(e,(k,v)=>(k==='updated'||k==='updatedAt'||k==='artworkThumb'||k==='coverThumb')?undefined:((k==='artworkData'||k==='cover')&&typeof v==='string'?v.length+v.slice(-24):v))}
function makeStamper(getLib){
 const H=new Map(),K=new Map();

function qrMatrix(text){const data=Array.from(new TextEncoder().encode(text));const ECC=[10,16,26,18,24,16,18,22,22,26],NB=[1,1,1,2,2,4,4,4,5,5];
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const na=Math.floor(v/7)+2;r-=(25*na-10)*na-55;if(v>=7)r-=36}return r};
 let ver=1;for(;ver<=10;ver++){const cap=Math.floor(raw(ver)/8)-ECC[ver-1]*NB[ver-1];if(4+(ver<10?8:16)+data.length*8<=cap*8)break}if(ver>10)return null;

async function recStart(onDone){if(S.rec)return;if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){toast('Recording isn’t available here — use “Attach audio / files…” and choose Record Audio.',true);return}

 const types=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
 const mr=new MediaRecorder(stream,mt?{mimeType:mt}:{});const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const t0=Date.now();
 const R={mr,t0,timer:setInterval(()=>{const el=$('#recT');if(el)el.textContent=fmtDur(Date.now()-t0)},400)};
 mr.onstop=async()=>{clearInterval(R.timer);stream.getTracks().forEach(t=>t.stop());S.rec=null;const type=(mr.mimeType||mt||'audio/webm').split(';')[0];const blob=new Blob(chunks,{type});try{await onDone(blob,type,Date.now()-t0)}catch(e){toast('Could not save recording: '+e.message,true)}updateRec()};
 mr.start(1000);S.rec=R;updateRec()}

/* ============ import / merge ============ */
async function applyInboxTexts(texts){let items=[],bad=0;for(const t of texts){const p=SVT.parseInbox(t);if(p)items.push(...p);else bad++}
 const r=SVT.applyInbox(S.lib,items);touch(null);await flush();refreshAll();toast(`Grok inbox: ${r.added} note(s) added${r.missed?', '+r.missed+' couldn’t be matched to a song':''}${bad?', '+bad+' unreadable file(s)':''}.`,!r.added&&!!(bad||r.missed))}
async function importFiles(files){await flush();STAMP.run();
 const isSync=f=>/\.(zip|json|songvault)$/i.test(f.name);const sf=files.filter(isSync),loose=files.filter(f=>!isSync(f));
 if(!sf.length){toast('Pick a “.songvault.zip” sync file (you can pick loose videos/audio with it).',true);return}
 let parsed;try{parsed=await SVS.parseSyncFile(sf[0])}catch(e){toast('Could not read that file: '+e.message,true);return}
 const looseMap=new Map();for(const f of loose)looseMap.set(await SVS.hashBlob(f),f);
 const plan=SVS.planMerge(S.lib,parsed.lib,{haveMedia:S.mediaIds,remoteHas:id=>(parsed.hasBlob&&parsed.hasBlob(id))||looseMap.has(id)});const sm=plan.summary;
 const rows=sm.details.slice(0,60).map(d=>`<div class="kv"><span>${E(d.type)} · ${E(d.title)}</span><b style="font-size:12px;text-align:right">${E(d.action)}${d.fields&&d.fields.length?'<br><small>'+E(d.fields.slice(0,4).join(', '))+'</small>':''}</b></div>`).join('');
 const html=`<div style="font-size:16px"><b class="ok">${sm.added}</b> added · <b class="ok">${sm.updated}</b> updated · <b class="${sm.conflicts?'warn':'ok'}">${sm.conflicts}</b> conflicts · <b>${sm.deleted}</b> deleted · ${sm.unchanged} unchanged</div><div class="hint" style="margin:8px 0">From <b>${E(plan.remoteDevice)}</b>. Newest edit wins field by field; nothing is deleted unless it was deleted on purpose. Conflicts keep the newer text and save the other as a “CONFLICT COPY” in Version history.</div><div class="hint">Media: ${sm.mediaToAdd.length} file(s) will be copied in${sm.mediaMissing.length?` · <span class="warn">${sm.mediaMissing.length} referenced but not in the file</span>`:''}</div><div style="margin-top:8px">${rows||'<div class="ok">Everything is already in sync.</div>'}</div>${sm.details.length>60?'<div class="hint">…and more</div>':''}`;
 const ok=await choose('Merge preview — '+sf[0].name,html,plan.total?'Apply merge':'Mark as synced','Cancel');
 if(!ok){toast('Import cancelled — nothing changed.');return}
 try{for(const r of sm.mediaToAdd){const b=looseMap.get(r.id)||await parsed.getBlob(r.id);if(b){await DB.mput(r.id,b);S.mediaIds.add(r.id)}}
  try{await DB.set('premerge',S.lib)}catch(e){}
  const keep=S.lib.settings;const m=plan.merged;m.songs=m.songs.map(normSong);m.settings=Object.assign({},m.settings||{},{deviceId:keep.deviceId,deviceName:keep.deviceName,toolPrefs:keep.toolPrefs,lastBackup:keep.lastBackup,dirtySince:keep.dirtySince,created:keep.created});
  S.lib=m;SVS.rebase(S.lib,plan);await hydrateThumbs();STAMP.init();S.lib.settings.lastSyncAt=now();await DB.set('lib',S.lib);refreshAll();
  toast(`Merged: ${sm.added} added, ${sm.updated} updated, ${sm.conflicts} conflicts, ${sm.deleted} deleted.`);
  if(parsed.inbox&&parsed.inbox.length)await applyInboxTexts(parsed.inbox)}
 catch(e){toast('Merge failed: '+e.message,true);console.error(e)}}

 if(el.dataset.t==='list')v=v.split(/[;,]/).map(x=>x.trim()).filter(Boolean);
